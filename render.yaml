services:
  - type: web
    name: life-abroad-api-staging
    runtime: node
    branch: staging
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @life-abroad/shared build && pnpm --filter server build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  - type: static_site
    name: life-abroad-client-staging
    branch: staging
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter game build
    publishPath: apps/game/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
